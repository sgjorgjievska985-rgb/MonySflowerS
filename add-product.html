<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mony's Flowers - Додади производ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top">
        <div class="container">
            <a class="navbar-brand text-white fw-bold fs-3" href="index.html">
                <i class="bi bi-flower1"></i> Mony's Flowers
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Почетна</a></li>
                    <li class="nav-item"><a class="nav-link active" href="add-product.html">Додади производ</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="card shadow-sm border-0 p-4">
                    <h3 class="card-title text-success fw-bold mb-4">Внесете нов производ</h3>

                    <form>
                        <div class="mb-3">
                            <label for="productName" class="form-label fw-semibold">Име на цвеќе *</label>
                            <input type="text" class="form-control" id="productName" required>
                        </div>
                        <div class="mb-3">
                            <label for="productCategory" class="form-label fw-semibold">Категорија *</label>
                            <select class="form-select" id="productCategory" required>
                                <option value="" selected disabled>Изберете...</option>
                                <option value="buketi">Букети за роденден</option>
                                <option value="svadbeni">Свадбени аранжмани</option>
                                <option value="saksiski">Саксиски цвеќиња</option>
                            </select>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="productPrice" class="form-label fw-semibold">Цена (ден) *</label>
                                <input type="number" class="form-control" id="productPrice" required>
                            </div>
                            <div class="col-md-6">
                                <label for="productStock" class="form-label fw-semibold">Залиха *</label>
                                <input type="number" class="form-control" id="productStock" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="productImage" class="form-label fw-semibold">URL до слика *</label>
                            <input type="url" class="form-control" id="productImage" required>
                        </div>
                        <div class="mb-4">
                            <label for="productDescription" class="form-label fw-semibold">Опис *</label>
                            <textarea class="form-control" id="productDescription" rows="3" required></textarea>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="index.html" class="btn btn-outline-secondary">Откажи</a>
                            <button type="submit" class="btn btn-success">Зачувај производ</button>
                        </div>

                        <div class="card shadow-sm border-0 p-4 mt-4">
                            <h4 class="text-success fw-bold mb-3"><i class="bi bi-pie-chart-fill"></i> Извештај за продажба по категории</h4>
                        <div style="max-width: 400px;" class="mx-auto">
                            <canvas id="salesChart"></canvas>
                        </div>
                        </div>
                    </form>

                    <div class="card shadow-sm border-0 p-4 mt-4">
                        <h4 class="text-success fw-bold mb-3"><i class="bi bi-pie-chart-fill"></i> Извештај за продажба по категории</h4>
                        <div style="max-width: 400px;" class="mx-auto">
                            <canvas id="salesChart"></canvas>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/add-product.js"></script>
    <script src="js/admin.js"></script>
    
</body>
</html>
