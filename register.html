<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mony's Flowers - Регистрација</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-header text-white fw-bold fs-3 text-decoration-none" href="index.html">
                <i class="bi bi-flower1"></i> Mony's Flowers
            </a>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4">
                    <h3 class="text-center text-success fw-bold mb-4">Креирај Нов Профил</h3>
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Целосно Име</label>
                            <input type="text" class="form-control" placeholder="Петар Петровски" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Е-пошта</label>
                            <input type="email" class="form-control" placeholder="example@mail.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Лозинка</label>
                            <input type="password" class="form-control" placeholder="******" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Улога во системот (Затворен сет опции)</label>
                            <select class="form-select" required>
                                <option value="client" selected>Клиент / Купувач</option>
                                <option value="employee">Вработен / Аранжер</option>
                                <option value="admin">Администратор</option>
                            </select>
                        </div>
                        <button type="button" class="btn btn-success w-100 mb-3">Регистрирај се</button>
                        <p class="text-center small mb-0">Веќе имате профил? <a href="login.html">Најавете се</a></p>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-3 mt-auto text-center">
        <p class="mb-0">&copy; 2026 Mony's Flowers</p>
    </footer>
</body>
</html>
