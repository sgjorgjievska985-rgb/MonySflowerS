<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mony's Flowers - Уреди производ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top">
        <div class="container">
            <a class="navbar-header text-white fw-bold fs-3 text-decoration-none" href="index.html">
                <i class="bi bi-flower1"></i> Mony's Flowers
            </a>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="card shadow-sm border-0 p-4">
                    <h3 class="card-title text-warning text-dark fw-bold mb-4">
                        <i class="bi bi-pencil-square"></i> Уреди производ
                    </h3>

                    <form>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Име на цвеќе</label>
                            <input type="text" class="form-control" value="Кралевски Црвени Рози">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Категорија</label>
                            <select class="form-select">
                                <option value="">Сите категории</option>
                                <option value="lalinja">Лалиња</option>
                                <option value="svadbeni">Свадбени аранжмани</option>
                                <option value="saksiski">Саксискo цвеќe</option>
                                <option value="rozi">Рози</option>
                                <option value="proletni">Пролетна Колекција</option>
                            </select>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Цена (ден.)</label>
                                <input type="number" class="form-control" value="1500">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Залиха</label>
                                <input type="number" class="form-control" value="10">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Опис</label>
                            <textarea class="form-control" rows="3">Елегантен букет од 101 свежа црвена роза...</textarea>
                        </div>

                        <div class="d-flex justify-content-between">
                            <button type="button" class="btn btn-danger"><i class="bi bi-trash"></i> Избриши производ</button>
                            <div>
                                <a href="index.html" class="btn btn-outline-secondary">Откажи</a>
                                <button type="button" class="btn btn-success">Зачувај промени</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Mony's Flowers</p>
        </div>
    </footer>
</body>
</html>
